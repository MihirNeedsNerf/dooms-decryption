<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live Leaderboard | Doom's Decryption | DJS SIGAI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
  <style>
    .lb-container {
      max-width: 1200px;
      margin: 2rem auto;
      padding: 0 1rem;
    }
    .lb-header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }
    .lb-table-wrap {
      background: var(--bg-panel);
      border: 1px solid var(--titanium-border);
      border-radius: 4px;
      overflow-x: auto;
      box-shadow: 0 0 25px var(--doom-green-glow);
    }
    .lb-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-family: var(--font-body);
    }
    .lb-table th {
      background: #090e13;
      color: var(--doom-green);
      font-family: var(--font-mono);
      font-size: 0.85rem;
      letter-spacing: 1.5px;
      padding: 1rem 1.25rem;
      border-bottom: 2px solid var(--doom-green);
    }
    .lb-table td {
      padding: 0.9rem 1.25rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      font-size: 1rem;
    }
    .lb-table tr:hover {
      background: rgba(16, 185, 129, 0.05);
    }
    .rank-cell {
      font-family: var(--font-display);
      font-weight: 900;
      font-size: 1.2rem;
    }
    .rank-1 { color: #facc15; text-shadow: 0 0 8px #facc15; }
    .rank-2 { color: #cbd5e1; text-shadow: 0 0 8px #cbd5e1; }
    .rank-3 { color: #d97706; text-shadow: 0 0 8px #d97706; }
    .score-cell {
      font-family: var(--font-display);
      font-weight: 700;
      color: var(--doom-green-bright);
      font-size: 1.2rem;
    }
    .time-cell {
      font-family: var(--font-mono);
      color: #38bdf8;
    }
    .empty-state {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--text-dim);
      font-family: var(--font-mono);
    }
    .refresh-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-family: var(--font-mono);
      font-size: 0.8rem;
      color: var(--doom-green);
    }
  </style>
</head>
<body class="doom-theme">
  <div class="cyber-overlay"></div>
  <div class="scanlines"></div>

  <div class="lb-container">
    <div class="lb-header-bar">
      <div>
        <div class="theme-tag">DJS SIGAI • AVENGERS: DOOMSDAY</div>
        <h1 class="glitch-text" style="font-size: 2.2rem;">LIVE LEADERBOARD</h1>
        <p class="sub-title">REAL-TIME DECRYPTION TRANSMISSIONS</p>
      </div>

      <div style="display: flex; gap: 0.75rem; align-items: center;">
        <div class="refresh-badge">
          <span class="glow-dot"></span>
          <span>LIVE AUTO-SYNC (5s)</span>
        </div>
        <a href="/api/export-csv" class="btn-hud">
          <span>📥 EXPORT CSV</span>
        </a>
        <a href="index.html" class="btn-hud">
          <span>🎮 GAME MATRIX</span>
        </a>
      </div>
    </div>

    <div class="lb-table-wrap">
      <table class="lb-table">
        <thead>
          <tr>
            <th>RANK</th>
            <th>UNIT / TEAM NAME</th>
            <th>OPERATIVES</th>
            <th>SCORE</th>
            <th>ERRORS</th>
            <th>CORRECT</th>
            <th>TIME TAKEN</th>
            <th>TRANSMITTED</th>
          </tr>
        </thead>
        <tbody id="leaderboardBody">
          <tr>
            <td colspan="8" class="empty-state">Awaiting incoming transmissions from the field...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    async function fetchLeaderboard() {
      try {
        const res = await fetch('/api/leaderboard');
        const data = await res.json();
        const tbody = document.getElementById('leaderboardBody');

        if (!data.success || !data.leaderboard || data.leaderboard.length === 0) {
          tbody.innerHTML = '<tr><td colspan="8" class="empty-state">No transmissions logged yet. Units are decrypting...</td></tr>';
          return;
        }

        tbody.innerHTML = data.leaderboard.map((row, idx) => {
          const rank = idx + 1;
          const rankClass = rank === 1 ? 'rank-1' : rank === 2 ? 'rank-2' : rank === 3 ? 'rank-3' : '';
          const mins = Math.floor(row.time_taken_seconds / 60);
          const secs = (row.time_taken_seconds % 60).toString().padStart(2, '0');
          const timeFormatted = `${mins}:${secs}`;
          const timeAgo = new Date(row.submitted_at + 'Z').toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

          return `
            <tr>
              <td class="rank-cell ${rankClass}">#${rank}</td>
              <td style="font-weight: 700; color: #fff;">${escapeHtml(row.team_name)}</td>
              <td style="color: var(--text-muted); font-size: 0.9rem;">${escapeHtml(row.members || '—')}</td>
              <td class="score-cell">+${row.score} PTS</td>
              <td style="color: var(--strike-red); font-family: var(--font-mono);">${row.error_count}</td>
              <td style="color: var(--doom-green-bright); font-family: var(--font-mono);">${row.correct_count} / 59</td>
              <td class="time-cell">${timeFormatted}</td>
              <td style="font-family: var(--font-mono); font-size: 0.85rem; color: var(--text-dim);">${timeAgo}</td>
            </tr>
          `;
        }).join('');
      } catch (err) {
        console.error('Leaderboard sync error:', err);
      }
    }

    function escapeHtml(str) {
      return (str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    fetchLeaderboard();
    setInterval(fetchLeaderboard, 5000);
  </script>
</body>
</html>
